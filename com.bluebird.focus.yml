app-id: com.bluebird.focus

runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk

sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22

command: bluebird-focus

finish-args:
  # Network access for Firebase auth and the Bluebird backend API
  - --share=network
  # Shared memory for X11
  - --share=ipc
  # Display support
  - --socket=fallback-x11
  - --socket=wayland
  # GPU acceleration for WebKit rendering
  - --device=dri
  # System tray icon (StatusNotifierItem)
  - --talk-name=org.kde.StatusNotifierWatcher
  # Desktop notifications
  - --talk-name=org.freedesktop.Notifications
  # WebKit DMA-BUF renderer causes issues with some Wayland compositors
  - --env=WEBKIT_DISABLE_DMABUF_RENDERER=1

modules:
  - name: bluebird-focus
    buildsystem: simple

    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin
      env:
        CARGO_HOME: /run/build/bluebird-focus/cargo
        CARGO_NET_OFFLINE: 'true'
        npm_config_cache: /run/build/bluebird-focus/flatpak-node/npm-cache
        npm_config_offline: 'true'

    build-commands:
      # 1. Install Node dependencies from vendored cache
      - npm ci --offline

      # 2. Build the React frontend (outputs to build/)
      - npm run build

      # 3. Build and bundle via Tauri CLI (properly embeds the frontend)
      - npm run tauri build -- --no-bundle

      # 4. Install the binary
      - install -Dm755 src-tauri/target/release/bluebird-focus /app/bin/bluebird-focus

      # 5. Install icons
      - install -Dm644 src-tauri/icons/32x32.png
          /app/share/icons/hicolor/32x32/apps/com.bluebird.focus.png
      - install -Dm644 src-tauri/icons/128x128.png
          /app/share/icons/hicolor/128x128/apps/com.bluebird.focus.png
      - install -Dm644 src-tauri/icons/128x128@2x.png
          /app/share/icons/hicolor/256x256/apps/com.bluebird.focus.png

      # 6. Install desktop entry and AppStream metainfo
      - install -Dm644 com.bluebird.focus.desktop
          /app/share/applications/com.bluebird.focus.desktop
      - install -Dm644 com.bluebird.focus.metainfo.xml
          /app/share/metainfo/com.bluebird.focus.metainfo.xml

    sources:
      - type: git
        url: https://github.com/YomenT/bluebird-focus
        commit: 46170d8f34f850d3c275035b85da659644c0200f

      # Vendored Cargo dependencies
      - cargo-sources.json

      # Vendored npm dependencies
      - npm-sources.json
