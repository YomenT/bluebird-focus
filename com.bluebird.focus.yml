app-id: com.bluebird.focus

runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk

sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22

command: bluebird-focus

finish-args:
  # Network access for Firebase auth and the Bluebird backend API
  - --share=network
  # Shared memory for X11
  - --share=ipc
  # Display support
  - --socket=fallback-x11
  - --socket=wayland
  # GPU acceleration for WebKit rendering
  - --device=dri
  # System tray icon (StatusNotifierItem)
  - --talk-name=org.kde.StatusNotifierWatcher
  # Desktop notifications
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: bluebird-focus
    buildsystem: simple

    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin
      env:
        CARGO_HOME: /run/build/bluebird-focus/cargo
        CARGO_NET_OFFLINE: 'true'
        npm_config_cache: /run/build/bluebird-focus/npm-cache
        npm_config_offline: 'true'

    build-commands:
      # 1. Install Node dependencies from vendored cache
      - npm ci --offline

      # 2. Build the React frontend (outputs to build/)
      - npm run build

      # 3. Build the Tauri/Rust binary (embeds the frontend via frontendDist)
      - cargo build --release --manifest-path src-tauri/Cargo.toml

      # 4. Install the binary
      - install -Dm755 src-tauri/target/release/bluebird-focus /app/bin/bluebird-focus

      # 5. Install icons
      - install -Dm644 src-tauri/icons/32x32.png
          /app/share/icons/hicolor/32x32/apps/com.bluebird.focus.png
      - install -Dm644 src-tauri/icons/128x128.png
          /app/share/icons/hicolor/128x128/apps/com.bluebird.focus.png
      - install -Dm644 src-tauri/icons/128x128@2x.png
          /app/share/icons/hicolor/256x256/apps/com.bluebird.focus.png

      # 6. Install desktop entry and AppStream metainfo
      - install -Dm644 com.bluebird.focus.desktop
          /app/share/applications/com.bluebird.focus.desktop
      - install -Dm644 com.bluebird.focus.metainfo.xml
          /app/share/metainfo/com.bluebird.focus.metainfo.xml

    sources:
      # App source — pin to a specific commit before submitting to Flathub.
      # Run: git rev-parse HEAD  in the bluebird-focus repo to get the hash.
      - type: git
        url: https://github.com/YomenT/bluebird-focus
        commit: 808ab03dfc25f2e8b1170d2d8665d7ccc8c35324

      # Vendored Cargo dependencies (offline build).
      # Generate with:
      #   python3 flatpak-cargo-generator.py src-tauri/Cargo.lock -o cargo-sources.json
      # Tool: https://github.com/flatpak/flatpak-builder-tools/tree/master/cargo
      - cargo-sources.json

      # Vendored npm dependencies (offline build).
      # Generate with:
      #   flatpak-node-generator npm package-lock.json -o npm-sources.json
      # Tool: https://github.com/flatpak/flatpak-builder-tools/tree/master/node
      - npm-sources.json
