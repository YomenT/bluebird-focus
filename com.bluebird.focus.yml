app-id: com.bluebird.focus

runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk

sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable

command: bluebird-focus

finish-args:
  # Network access for Firebase auth and the Bluebird backend API
  - --share=network
  # Shared memory for X11
  - --share=ipc
  # Display support
  - --socket=fallback-x11
  - --socket=wayland
  # GPU acceleration for WebKit rendering
  - --device=dri
  # System tray icon (StatusNotifierItem)
  - --talk-name=org.kde.StatusNotifierWatcher
  # Desktop notifications
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: bluebird-focus
    buildsystem: simple

    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/bluebird-focus/cargo
        CARGO_NET_OFFLINE: 'true'

    build-commands:
      # 1. Build the Tauri/Rust binary (frontend is pre-built and included as a source)
      - cargo build --release --manifest-path src-tauri/Cargo.toml

      # 2. Install the binary
      - install -Dm755 src-tauri/target/release/bluebird-focus /app/bin/bluebird-focus

      # 3. Install icons
      - install -Dm644 src-tauri/icons/32x32.png
          /app/share/icons/hicolor/32x32/apps/com.bluebird.focus.png
      - install -Dm644 src-tauri/icons/128x128.png
          /app/share/icons/hicolor/128x128/apps/com.bluebird.focus.png
      - install -Dm644 src-tauri/icons/128x128@2x.png
          /app/share/icons/hicolor/256x256/apps/com.bluebird.focus.png

      # 4. Install desktop entry and AppStream metainfo
      - install -Dm644 com.bluebird.focus.desktop
          /app/share/applications/com.bluebird.focus.desktop
      - install -Dm644 com.bluebird.focus.metainfo.xml
          /app/share/metainfo/com.bluebird.focus.metainfo.xml

    sources:
      - type: git
        url: https://github.com/YomenT/bluebird-focus
        commit: 808ab03dfc25f2e8b1170d2d8665d7ccc8c35324

      # Pre-built React frontend (run `npm run build` locally before building the Flatpak)
      - type: dir
        path: build
        dest: build

      # Vendored Cargo dependencies
      - cargo-sources.json
